<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Market Explorer · Amul Dark Chocolate × UAE · Premium Market Intelligence</title>
<!-- External dependencies (need internet): Google Fonts, Apache ECharts 5.5.1, D3 v7, topojson-client 3, world-atlas 2 (country shapes), Lucide icons. All other code is in this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#171716;--side:#1D1D1B;--card:#242422;--card2:#2B2A27;
  --gold:#D9AF79;--gold-l:#F2D2A6;--bronze:#A77C4E;--bronze-d:#72563C;
  --tx:#F3EFE9;--tx2:#B3ADA3;--tx3:#85817A;--line:#393630;
  --pos:#83B49B;--neg:#C97870;--warn:#D6AD72;
  --grad:linear-gradient(90deg,#72563C 0%,#A77C4E 45%,#D9AF79 80%,#F2D2A6 100%);
  --r:12px;--sw:64px;--swx:236px;
  --f-ui:'Manrope','Inter',system-ui,sans-serif;--f-num:'DM Sans','Manrope',sans-serif;--f-head:'Playfair Display',Georgia,serif;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f-ui);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 75% -10%,rgba(217,175,121,.06),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(167,124,78,.05),transparent 60%),var(--bg);min-height:100vh;overflow-x:hidden}
a{color:var(--gold)}a:hover{color:var(--gold-l)}
button,input,select{font-family:inherit;font-size:12px;color:var(--tx)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:width .3s ease}
body.side-open .side{width:var(--swx)}
.side-top{display:flex;align-items:center;gap:10px;padding:14px 16px;height:58px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#1b1a18;font-family:var(--f-head);font-weight:600;font-size:15px;flex:none;box-shadow:0 0 18px rgba(217,175,121,.25)}
.brand-t{white-space:nowrap;overflow:hidden;opacity:0;transition:opacity .2s}
body.side-open .brand-t{opacity:1}
.brand-t b{display:block;font-family:var(--f-head);font-weight:500;font-size:14px;color:var(--gold-l)}
.brand-t span{font-size:10px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;position:relative;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-ind{position:absolute;left:0;width:3px;height:34px;border-radius:0 3px 3px 0;background:var(--grad);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(217,175,121,.5)}
.nav button{display:flex;align-items:center;gap:12px;width:100%;height:34px;margin:2px 0;padding:0 20px;background:none;border:0;color:var(--tx3);cursor:pointer;position:relative;white-space:nowrap;text-align:left}
.nav button svg{width:18px;height:18px;flex:none;stroke-width:1.6}
.nav button span{opacity:0;transition:opacity .2s;font-size:12.5px}
body.side-open .nav button span{opacity:1}
.nav button:hover{color:var(--gold-l)}
.nav button.on{color:var(--gold)}
.nav button.on::before{content:"";position:absolute;inset:3px 10px;border-radius:8px;background:rgba(217,175,121,.08)}
.nav-tip{position:fixed;left:calc(var(--sw) + 6px);background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:5px 9px;border-radius:7px;font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:60;white-space:nowrap}
body.side-open .nav-tip{display:none}
.side-bot{border-top:1px solid var(--line);padding:8px 0}

/* main */
.main{margin-left:var(--sw);transition:margin .3s ease;min-width:0}
body.side-open .main{margin-left:var(--swx)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 22px;height:58px;background:rgba(23,23,22,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--f-head);font-weight:500;font-size:17px;margin:0;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-family:var(--f-ui);font-size:11px;color:var(--tx3);margin-left:10px;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.search{position:relative}
.search input{width:220px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 30px;outline:none}
.search input:focus{border-color:var(--bronze)}
.search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--tx3)}
.sres{position:absolute;top:36px;right:0;width:340px;max-height:360px;overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50}
.sres.on{display:block}
.sres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer}
.sres button:hover{background:rgba(217,175,121,.07)}
.sres b{color:var(--gold);font-weight:600;font-size:12px}.sres span{display:block;color:var(--tx3);font-size:11px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:7px;color:var(--tx3);cursor:pointer;font-family:var(--f-num);font-weight:600}
.seg button.on{background:var(--grad);color:#1b1a18}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--tx2)}
.ib:hover{color:var(--gold-l);border-color:var(--bronze-d)}
.ib svg{width:16px;height:16px}
.page{padding:18px 22px 60px;display:none}
.page.on{display:block;animation:pg .45s ease}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 14px;flex-wrap:wrap}
.ph h2{font-family:var(--f-head);font-weight:500;font-size:22px;margin:0;color:var(--tx)}
.ph p{margin:3px 0 0;color:var(--tx2);max-width:760px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.tag.v{color:var(--pos);border-color:rgba(131,180,155,.35)}.tag.e{color:var(--warn);border-color:rgba(214,173,114,.35)}.tag.s{color:#b9a3e6;border-color:rgba(185,163,230,.3)}.tag.f{color:#8fb3d9;border-color:rgba(143,179,217,.3)}.tag.r{color:var(--gold);border-color:rgba(217,175,121,.35)}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:linear-gradient(180deg,var(--card2),var(--card) 38%);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;min-width:0;transition:transform .25s ease,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);border-color:#4a453c;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 34px rgba(0,0,0,.45)}
.card.stagger{opacity:0;transform:translateY(10px)}
.card.stagger.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
svg{overflow:hidden}.main{overflow-x:hidden}
.ch h3{margin:0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:7px}
.ch h3 svg{width:14px;height:14px;color:var(--gold)}
.tools{display:flex;gap:4px;align-items:center}
.tb{width:24px;height:24px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:6px;color:var(--tx3);cursor:pointer}
.tb:hover{border-color:var(--line);color:var(--gold-l)}
.tb svg{width:13px;height:13px}
.chart{width:100%;height:230px}
.chart.sm{height:170px}.chart.md{height:270px}.chart.lg{height:340px}
.note{font-size:11px;color:var(--tx3);margin:8px 0 0}
.muted{color:var(--tx3)}.dim{color:var(--tx2)}
.kpi{font-family:var(--f-num);font-weight:600;font-size:26px;color:var(--tx);letter-spacing:-.01em;line-height:1.1}
.kpi small{font-size:12px;color:var(--tx2);font-weight:500;margin-left:4px}
.kl{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em}
.gold{color:var(--gold)}.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.ktile{display:grid;grid-template-columns:1fr 86px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ktile:last-child{border-bottom:0}
.ktile .spark{height:34px;width:86px}
.src{font-size:10.5px;color:var(--tx3)}
.src a{color:var(--bronze);text-decoration:none}.src a:hover{color:var(--gold-l)}
.hint{cursor:help;border-bottom:1px dotted var(--tx3)}

/* bars */
.pbar{margin:9px 0}
.pbar .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.pbar .t b{font-family:var(--f-num);color:var(--gold-l);font-weight:600}
.track{height:7px;border-radius:7px;background:#1b1b19;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden}
.fill{height:100%;border-radius:7px;background:var(--grad);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* intro card */
.intro{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:290px}
.intro h2{font-family:var(--f-head);font-weight:500;font-size:24px;line-height:1.15;margin:6px 0 6px;color:var(--tx)}
.intro h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.route{display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:12px;color:var(--gold-l);margin:8px 0}
.route i{flex:1;height:1px;background:var(--grad);position:relative;overflow:hidden}
.route i::after{content:"";position:absolute;top:-2px;width:18px;height:5px;border-radius:5px;background:var(--gold-l);filter:blur(1px);animation:run 2.6s linear infinite}
@keyframes run{from{left:-20px}to{left:100%}}
.globe-wrap{position:relative;min-height:260px}
.globe-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.globe-ctrl{position:absolute;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:100%}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--tx2);font-size:11px;display:inline-flex;align-items:center;gap:5px}
.chip:hover{color:var(--gold-l);border-color:var(--bronze-d)}
.chip.on{color:#1b1a18;background:var(--grad);border-color:transparent}
.chip svg{width:12px;height:12px}
.ginfo{position:absolute;left:0;top:0;background:rgba(36,36,34,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;max-width:220px;display:none}
.ginfo.on{display:block}
.ginfo b{color:var(--gold-l)}

/* tables */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{position:sticky;top:0;background:#20201e;text-align:left;font-weight:600;color:var(--tx2);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
table.t th.sort{cursor:pointer}table.t th.sort:hover{color:var(--gold-l)}
table.t th .ar{color:var(--gold);margin-left:4px}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:rgba(217,175,121,.035)}
table.t td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
table.t tr.hl td{background:rgba(217,175,121,.07)}
.mono{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;color:#1b1a18;background:var(--grad);font-size:13px}
.mono.alt{background:linear-gradient(135deg,#4a463f,#2f2d29);color:var(--gold-l);border:1px solid var(--line)}
input.txt,select.sel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none}
select.sel{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
select.sel:focus,input.txt:focus{border-color:var(--bronze)}
input.rnum{width:44px;background:#1d1d1b;border:1px solid var(--line);border-radius:6px;padding:3px 4px;text-align:center;font-family:var(--f-num)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--bronze) var(--p,50%),#34322d var(--p,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold-l);border:2px solid var(--bronze);box-shadow:0 0 8px rgba(217,175,121,.45)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold-l);border:2px solid var(--bronze)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--tx2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--gold-l);border-color:var(--bronze-d)}
.btn.pri{background:var(--grad);color:#1b1a18;border-color:transparent;font-weight:600}
.btn svg{width:13px;height:13px}
.sl{margin:8px 0}
.sl .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-bottom:5px}
.sl .t b{font-family:var(--f-num);color:var(--gold-l)}

/* accordions */
.acc{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 14px;cursor:pointer;text-align:left;color:var(--tx)}
.acc>button .ttl{flex:1;font-weight:600;font-size:13px}
.acc>button .chev{transition:transform .3s;color:var(--gold)}
.acc.open>button .chev{transform:rotate(180deg)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.acc.open .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden}
.acc .inner{padding:0 14px 12px;color:var(--tx2)}
.acc .inner h4{margin:10px 0 4px;color:var(--gold);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.acc .inner p,.acc .inner ul{margin:0 0 4px}
.acc .inner ul{padding-left:18px}

.list button.li{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;text-align:left;color:var(--tx)}
.list button.li:last-child{border-bottom:0}
.list .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(217,175,121,.1);color:var(--gold);flex:none}
.list .dot svg{width:14px;height:14px}
.list b{font-weight:600;font-size:12.5px;display:block}.list span{font-size:11px;color:var(--tx3)}
.list .go{margin-left:auto;color:var(--tx3)}

.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{cursor:pointer}
.sw h4{margin:0 0 6px;font-family:var(--f-head);font-weight:500;font-size:18px}
.sw ul{margin:0;padding-left:18px;color:var(--tx2)}
.sw.sel{border-color:var(--bronze)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.persona{display:grid;grid-template-columns:72px 1fr;gap:12px}
.avatar{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F2D2A6,#A77C4E 55%,#3b2e22);display:grid;place-items:center;font-family:var(--f-head);font-size:24px;color:#1b1a18}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--tx3)}.kv dd{margin:0;color:var(--tx)}
.gantt{position:relative}
.flow{width:100%;height:130px}
.flow .node rect{fill:#2B2A27;stroke:#393630}
.flow .node text{fill:#F3EFE9;font-size:11px}
.flow .lnk{stroke:url(#fg);stroke-width:2;fill:none;stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.cal{display:grid;grid-template-columns:120px repeat(12,minmax(0,1fr));gap:3px;font-size:11px}
.cal .mh{color:var(--tx3);text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.cal .rl{color:var(--tx2);padding:5px 0}
.cal .cell{height:24px;border-radius:5px;background:#1d1d1b;cursor:pointer;position:relative}
.cal .cell.on{background:var(--grad)}
.cal .cell.mid{background:linear-gradient(90deg,#4b3a29,#72563C)}
.emap .em{cursor:pointer;transition:fill .25s}
.emap .em:hover{fill:#3a342b}
.emap .em.sel{fill:url(#gg)}
.emap text{pointer-events:none;font-size:10px;fill:#F3EFE9}

/* assistant */
.fab{position:fixed;right:22px;bottom:22px;width:50px;height:50px;border-radius:50%;background:var(--grad);border:0;cursor:pointer;color:#1b1a18;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 6px rgba(217,175,121,.08);z-index:45}
.fab svg{width:22px;height:22px}
.asst{position:fixed;right:22px;bottom:84px;width:380px;max-width:calc(100vw - 30px);height:520px;max-height:calc(100vh - 120px);background:var(--card2);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:46;display:none;flex-direction:column}
.asst.on{display:flex;animation:pg .3s ease}
.asst header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.asst header b{font-family:var(--f-head);font-weight:500;font-size:15px}
.asst .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 11px;border-radius:10px;font-size:12.5px;max-width:92%}
.msg.u{align-self:flex-end;background:rgba(217,175,121,.14);color:var(--gold-l)}
.msg.a{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.msg.a .refs{margin-top:6px;font-size:10.5px;color:var(--tx3)}
.asst .qs{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px}
.asst form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.asst form input{flex:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,9,.78);z-index:70;display:none;align-items:center;justify-content:center;padding:30px}
.modal.on{display:flex}
.modal .box{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:min(1100px,100%);max-height:100%;overflow:auto;padding:16px 18px}
.modal .box .chart{height:min(70vh,560px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--bronze-d);padding:8px 14px;border-radius:10px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
