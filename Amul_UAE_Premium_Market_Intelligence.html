<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Market Explorer · Amul Dark Chocolate × UAE · Premium Market Intelligence</title>
<!-- External dependencies (need internet): Google Fonts, Apache ECharts 5.5.1, D3 v7, topojson-client 3, world-atlas 2 (country shapes), Lucide icons. All other code is in this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#171716;--side:#1D1D1B;--card:#242422;--card2:#2B2A27;
  --gold:#D9AF79;--gold-l:#F2D2A6;--bronze:#A77C4E;--bronze-d:#72563C;
  --tx:#F3EFE9;--tx2:#B3ADA3;--tx3:#85817A;--line:#393630;
  --pos:#83B49B;--neg:#C97870;--warn:#D6AD72;
  --grad:linear-gradient(90deg,#72563C 0%,#A77C4E 45%,#D9AF79 80%,#F2D2A6 100%);
  --r:12px;--sw:64px;--swx:236px;
  --f-ui:'Manrope','Inter',system-ui,sans-serif;--f-num:'DM Sans','Manrope',sans-serif;--f-head:'Playfair Display',Georgia,serif;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f-ui);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 75% -10%,rgba(217,175,121,.06),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(167,124,78,.05),transparent 60%),var(--bg);min-height:100vh;overflow-x:hidden}
a{color:var(--gold)}a:hover{color:var(--gold-l)}
button,input,select{font-family:inherit;font-size:12px;color:var(--tx)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:width .3s ease}
body.side-open .side{width:var(--swx)}
.side-top{display:flex;align-items:center;gap:10px;padding:14px 16px;height:58px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#1b1a18;font-family:var(--f-head);font-weight:600;font-size:15px;flex:none;box-shadow:0 0 18px rgba(217,175,121,.25)}
.brand-t{white-space:nowrap;overflow:hidden;opacity:0;transition:opacity .2s}
body.side-open .brand-t{opacity:1}
.brand-t b{display:block;font-family:var(--f-head);font-weight:500;font-size:14px;color:var(--gold-l)}
.brand-t span{font-size:10px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;position:relative;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-ind{position:absolute;left:0;width:3px;height:34px;border-radius:0 3px 3px 0;background:var(--grad);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(217,175,121,.5)}
.nav button{display:flex;align-items:center;gap:12px;width:100%;height:34px;margin:2px 0;padding:0 20px;background:none;border:0;color:var(--tx3);cursor:pointer;position:relative;white-space:nowrap;text-align:left}
.nav button svg{width:18px;height:18px;flex:none;stroke-width:1.6}
.nav button span{opacity:0;transition:opacity .2s;font-size:12.5px}
body.side-open .nav button span{opacity:1}
.nav button:hover{color:var(--gold-l)}
.nav button.on{color:var(--gold)}
.nav button.on::before{content:"";position:absolute;inset:3px 10px;border-radius:8px;background:rgba(217,175,121,.08)}
.nav-tip{position:fixed;left:calc(var(--sw) + 6px);background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:5px 9px;border-radius:7px;font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:60;white-space:nowrap}
body.side-open .nav-tip{display:none}
.side-bot{border-top:1px solid var(--line);padding:8px 0}

/* main */
.main{margin-left:var(--sw);transition:margin .3s ease;min-width:0}
body.side-open .main{margin-left:var(--swx)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 22px;height:58px;background:rgba(23,23,22,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--f-head);font-weight:500;font-size:17px;margin:0;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-family:var(--f-ui);font-size:11px;color:var(--tx3);margin-left:10px;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.search{position:relative}
.search input{width:220px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 30px;outline:none}
.search input:focus{border-color:var(--bronze)}
.search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--tx3)}
.sres{position:absolute;top:36px;right:0;width:340px;max-height:360px;overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50}
.sres.on{display:block}
.sres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer}
.sres button:hover{background:rgba(217,175,121,.07)}
.sres b{color:var(--gold);font-weight:600;font-size:12px}.sres span{display:block;color:var(--tx3);font-size:11px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:7px;color:var(--tx3);cursor:pointer;font-family:var(--f-num);font-weight:600}
.seg button.on{background:var(--grad);color:#1b1a18}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--tx2)}
.ib:hover{color:var(--gold-l);border-color:var(--bronze-d)}
.ib svg{width:16px;height:16px}
.page{padding:18px 22px 60px;display:none}
.page.on{display:block;animation:pg .45s ease}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 14px;flex-wrap:wrap}
.ph h2{font-family:var(--f-head);font-weight:500;font-size:22px;margin:0;color:var(--tx)}
.ph p{margin:3px 0 0;color:var(--tx2);max-width:760px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.tag.v{color:var(--pos);border-color:rgba(131,180,155,.35)}.tag.e{color:var(--warn);border-color:rgba(214,173,114,.35)}.tag.s{color:#b9a3e6;border-color:rgba(185,163,230,.3)}.tag.f{color:#8fb3d9;border-color:rgba(143,179,217,.3)}.tag.r{color:var(--gold);border-color:rgba(217,175,121,.35)}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:linear-gradient(180deg,var(--card2),var(--card) 38%);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;min-width:0;transition:transform .25s ease,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);border-color:#4a453c;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 34px rgba(0,0,0,.45)}
.card.stagger{opacity:0;transform:translateY(10px)}
.card.stagger.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
svg{overflow:hidden}.main{overflow-x:hidden}
.ch h3{margin:0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:7px}
.ch h3 svg{width:14px;height:14px;color:var(--gold)}
.tools{display:flex;gap:4px;align-items:center}
.tb{width:24px;height:24px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:6px;color:var(--tx3);cursor:pointer}
.tb:hover{border-color:var(--line);color:var(--gold-l)}
.tb svg{width:13px;height:13px}
.chart{width:100%;height:230px}
.chart.sm{height:170px}.chart.md{height:270px}.chart.lg{height:340px}
.note{font-size:11px;color:var(--tx3);margin:8px 0 0}
.muted{color:var(--tx3)}.dim{color:var(--tx2)}
.kpi{font-family:var(--f-num);font-weight:600;font-size:26px;color:var(--tx);letter-spacing:-.01em;line-height:1.1}
.kpi small{font-size:12px;color:var(--tx2);font-weight:500;margin-left:4px}
.kl{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em}
.gold{color:var(--gold)}.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.ktile{display:grid;grid-template-columns:1fr 86px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ktile:last-child{border-bottom:0}
.ktile .spark{height:34px;width:86px}
.src{font-size:10.5px;color:var(--tx3)}
.src a{color:var(--bronze);text-decoration:none}.src a:hover{color:var(--gold-l)}
.hint{cursor:help;border-bottom:1px dotted var(--tx3)}

/* bars */
.pbar{margin:9px 0}
.pbar .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.pbar .t b{font-family:var(--f-num);color:var(--gold-l);font-weight:600}
.track{height:7px;border-radius:7px;background:#1b1b19;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden}
.fill{height:100%;border-radius:7px;background:var(--grad);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* intro card */
.intro{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:290px}
.intro h2{font-family:var(--f-head);font-weight:500;font-size:24px;line-height:1.15;margin:6px 0 6px;color:var(--tx)}
.intro h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.route{display:flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:12px;color:var(--gold-l);margin:8px 0}
.route i{flex:1;height:1px;background:var(--grad);position:relative;overflow:hidden}
.route i::after{content:"";position:absolute;top:-2px;width:18px;height:5px;border-radius:5px;background:var(--gold-l);filter:blur(1px);animation:run 2.6s linear infinite}
@keyframes run{from{left:-20px}to{left:100%}}
.globe-wrap{position:relative;min-height:260px}
.globe-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.globe-ctrl{position:absolute;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:100%}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--tx2);font-size:11px;display:inline-flex;align-items:center;gap:5px}
.chip:hover{color:var(--gold-l);border-color:var(--bronze-d)}
.chip.on{color:#1b1a18;background:var(--grad);border-color:transparent}
.chip svg{width:12px;height:12px}
.ginfo{position:absolute;left:0;top:0;background:rgba(36,36,34,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;max-width:220px;display:none}
.ginfo.on{display:block}
.ginfo b{color:var(--gold-l)}

/* tables */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{position:sticky;top:0;background:#20201e;text-align:left;font-weight:600;color:var(--tx2);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
table.t th.sort{cursor:pointer}table.t th.sort:hover{color:var(--gold-l)}
table.t th .ar{color:var(--gold);margin-left:4px}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr:hover td{background:rgba(217,175,121,.035)}
table.t td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
table.t tr.hl td{background:rgba(217,175,121,.07)}
.mono{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;color:#1b1a18;background:var(--grad);font-size:13px}
.mono.alt{background:linear-gradient(135deg,#4a463f,#2f2d29);color:var(--gold-l);border:1px solid var(--line)}
input.txt,select.sel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none}
select.sel{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
select.sel:focus,input.txt:focus{border-color:var(--bronze)}
input.rnum{width:44px;background:#1d1d1b;border:1px solid var(--line);border-radius:6px;padding:3px 4px;text-align:center;font-family:var(--f-num)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--bronze) var(--p,50%),#34322d var(--p,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold-l);border:2px solid var(--bronze);box-shadow:0 0 8px rgba(217,175,121,.45)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold-l);border:2px solid var(--bronze)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--tx2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--gold-l);border-color:var(--bronze-d)}
.btn.pri{background:var(--grad);color:#1b1a18;border-color:transparent;font-weight:600}
.btn svg{width:13px;height:13px}
.sl{margin:8px 0}
.sl .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-bottom:5px}
.sl .t b{font-family:var(--f-num);color:var(--gold-l)}

/* accordions */
.acc{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 14px;cursor:pointer;text-align:left;color:var(--tx)}
.acc>button .ttl{flex:1;font-weight:600;font-size:13px}
.acc>button .chev{transition:transform .3s;color:var(--gold)}
.acc.open>button .chev{transform:rotate(180deg)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.acc.open .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden}
.acc .inner{padding:0 14px 12px;color:var(--tx2)}
.acc .inner h4{margin:10px 0 4px;color:var(--gold);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.acc .inner p,.acc .inner ul{margin:0 0 4px}
.acc .inner ul{padding-left:18px}

.list button.li{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;text-align:left;color:var(--tx)}
.list button.li:last-child{border-bottom:0}
.list .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(217,175,121,.1);color:var(--gold);flex:none}
.list .dot svg{width:14px;height:14px}
.list b{font-weight:600;font-size:12.5px;display:block}.list span{font-size:11px;color:var(--tx3)}
.list .go{margin-left:auto;color:var(--tx3)}

.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{cursor:pointer}
.sw h4{margin:0 0 6px;font-family:var(--f-head);font-weight:500;font-size:18px}
.sw ul{margin:0;padding-left:18px;color:var(--tx2)}
.sw.sel{border-color:var(--bronze)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.persona{display:grid;grid-template-columns:72px 1fr;gap:12px}
.avatar{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F2D2A6,#A77C4E 55%,#3b2e22);display:grid;place-items:center;font-family:var(--f-head);font-size:24px;color:#1b1a18}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--tx3)}.kv dd{margin:0;color:var(--tx)}
.gantt{position:relative}
.flow{width:100%;height:130px}
.flow .node rect{fill:#2B2A27;stroke:#393630}
.flow .node text{fill:#F3EFE9;font-size:11px}
.flow .lnk{stroke:url(#fg);stroke-width:2;fill:none;stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.cal{display:grid;grid-template-columns:120px repeat(12,minmax(0,1fr));gap:3px;font-size:11px}
.cal .mh{color:var(--tx3);text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.cal .rl{color:var(--tx2);padding:5px 0}
.cal .cell{height:24px;border-radius:5px;background:#1d1d1b;cursor:pointer;position:relative}
.cal .cell.on{background:var(--grad)}
.cal .cell.mid{background:linear-gradient(90deg,#4b3a29,#72563C)}
.emap .em{cursor:pointer;transition:fill .25s}
.emap .em:hover{fill:#3a342b}
.emap .em.sel{fill:url(#gg)}
.emap text{pointer-events:none;font-size:10px;fill:#F3EFE9}

/* assistant */
.fab{position:fixed;right:22px;bottom:22px;width:50px;height:50px;border-radius:50%;background:var(--grad);border:0;cursor:pointer;color:#1b1a18;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 6px rgba(217,175,121,.08);z-index:45}
.fab svg{width:22px;height:22px}
.asst{position:fixed;right:22px;bottom:84px;width:380px;max-width:calc(100vw - 30px);height:520px;max-height:calc(100vh - 120px);background:var(--card2);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);z-index:46;display:none;flex-direction:column}
.asst.on{display:flex;animation:pg .3s ease}
.asst header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.asst header b{font-family:var(--f-head);font-weight:500;font-size:15px}
.asst .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 11px;border-radius:10px;font-size:12.5px;max-width:92%}
.msg.u{align-self:flex-end;background:rgba(217,175,121,.14);color:var(--gold-l)}
.msg.a{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.msg.a .refs{margin-top:6px;font-size:10.5px;color:var(--tx3)}
.asst .qs{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px}
.asst form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.asst form input{flex:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,9,.78);z-index:70;display:none;align-items:center;justify-content:center;padding:30px}
.modal.on{display:flex}
.modal .box{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:min(1100px,100%);max-height:100%;overflow:auto;padding:16px 18px}
.modal .box .chart{height:min(70vh,560px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--bronze-d);padding:8px 14px;border-radius:10px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

function normW(){const tot=CRIT.reduce((a,c)=>a+(+S.w[c.k]||0),0);return Object.fromEntries(CRIT.map(c=>[c.k,tot?(+S.w[c.k]||0)/tot:0]))}
function scores(wOverride){const w=wOverride||normW();return SEGS.map(s=>{const contrib=Object.fromEntries(CRIT.map(c=>[c.k,w[c.k]*(+S.r[s.id][c.k])]));const sc=Object.values(contrib).reduce((a,b)=>a+b,0);return{id:s.id,n:s.n,score:Math.round(sc*100)/100,contrib}}).map((x,_,arr)=>x).sort((a,b)=>b.score-a.score).map((x,i,arr)=>Object.assign(x,{rank:1+arr.filter(y=>y.score>x.score).length}))}
function topSeg(){return scores()[0]}
function riskScores(){return RISKS.map(r=>{const v=S.risks[r.id]||{p:r.p,i:r.i};const sc=v.p*v.i;return Object.assign({},r,{p:v.p,i:v.i,score:sc,lvl:sc>=15?'High':sc>=8?'Medium':'Low'})}).sort((a,b)=>b.score-a.score)}

 function draw(now){

  ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=sph;ctx.fill();ctx.strokeStyle='rgba(217,175,121,0.35)';ctx.lineWidth=0.8;ctx.stroke();
  ctx.beginPath();path(grat);ctx.strokeStyle='rgba(217,175,121,0.07)';ctx.lineWidth=0.6;ctx.stroke();

    if(id===IND||id===UAE){ctx.fillStyle=GL.sel&&((GL.sel==='india'&&id===IND)||(GL.sel==='uae'&&id===UAE))?'rgba(242,210,166,0.75)':'rgba(217,175,121,0.45)';ctx.fill();ctx.strokeStyle='#F2D2A6';ctx.lineWidth=0.8;ctx.stroke()}

    const k=((now-GL.t0)/2600)%1;const p=interp(k);if(d3.geoDistance(p,[-GL.rot[0],-GL.rot[1]])<Math.PI/2){const q=proj(p);ctx.beginPath();ctx.arc(q[0],q[1],2.6,0,7);ctx.fillStyle='#fff3df';ctx.shadowColor='#F2D2A6';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0}}

  [['india',A],['uae',B]].forEach(([k,c])=>{if(d3.geoDistance(c,[-GL.rot[0],-GL.rot[1]])>=Math.PI/2)return;const q=proj(c);const pulse=REDUCE()?0:(Math.sin(now/400)+1)*2;
   ctx.beginPath();ctx.arc(q[0],q[1],4+pulse,0,7);ctx.fillStyle='rgba(217,175,121,0.18)';ctx.fill();ctx.beginPath();ctx.arc(q[0],q[1],3,0,7);ctx.fillStyle='#F2D2A6';ctx.fill();
   ctx.fillStyle='#F3EFE9';ctx.font='600 10px DM Sans';ctx.fillText(k==='india'?'INDIA':'UAE',q[0]+6,q[1]-6)});
  rings(cx,cy,r,now,true);

 function rings(cx,cy,r,now,front){ctx.save();ctx.translate(cx,cy);[[1.28,0.32,-0.35],[1.18,0.22,0.5]].forEach(([s,f,rot],i)=>{ctx.save();ctx.rotate(rot);ctx.beginPath();
   if(front)ctx.ellipse(0,0,r*s,r*s*f,0,0,Math.PI);else ctx.ellipse(0,0,r*s,r*s*f,0,Math.PI,2*Math.PI);

   const a=((now/(i?9000:13000))%1)*2*Math.PI;const inFront=Math.sin(a)>0;if(inFront===front){ctx.beginPath();ctx.arc(Math.cos(a)*r*s,Math.sin(a)*r*s*f,1.8,0,7);ctx.fillStyle='#F2D2A6';ctx.fill()}ctx.restore()});ctx.restore()}

  info.innerHTML=k==='india'?`<b>India · origin</b><br>Amul HQ, Anand (Gujarat). GCMMF turnover ₹73,450 crore (FY26); 36 lakh farmer members.<br><span class="src">${srcA('lakh')}</span>`:`<b>United Arab Emirates · target</b><br>Population 12.06 million (2025); 4.36 million Indian residents; real GDP +6.2% (2025).<br><span class="src">${srcA('fcsc25')} · ${srcA('amb')}</span>`;info.classList.add('on')}

   series:[{type:'radar',data:[{name:s.id+' '+s.n,value:CRIT.map(c=>S.r[s.id][c.k]),lineStyle:{color:G.gold},itemStyle:{color:G.gl},areaStyle:{color:'rgba(217,175,121,.3)'}}].concat(id==='S2'?[]:[{name:'S2 Indian expatriates',value:CRIT.map(c=>S.r.S2[c.k]),lineStyle:{color:G.tx3,type:'dashed'},itemStyle:{color:G.tx3},areaStyle:{color:'rgba(133,129,122,.08)'}}])}]})};
 $$('#segTabs .chip').forEach(b=>b.onclick=()=>show(b.dataset.seg));show('S2');

/* ---------- 8. EVALUATION ---------- */
PAGES.evaluation=root=>{
 root.innerHTML=ph('Dynamic Weighted Target Market Evaluation','Weighted score = Σ (normalised criterion weight × segment rating). Ratings are research-informed analytical estimates (1–5), not measured statistics.',tag('E'))+
 `<div class="grid">
  ${card('c4','Criterion weights (auto-normalised)','sliders-horizontal',`<div id="eW"></div><div class="row" style="margin-top:8px"><button class="btn" id="eReset">${ico('rotate-ccw')}Reset to report defaults</button></div><p class="note">Raw slider points are converted to percentages that always total 100%.</p>`)}
  ${card('c8','Live ranking','trophy',`<div id="eRank" class="chart md"></div><div id="eWhy" class="note" style="font-size:12px"></div>`,tools('eRank','eval'))}
  ${card('c12','Editable segment ratings (1–5)','table',`<div class="tw"><table class="t" id="eTable"></table></div><p class="note">Edit any rating; scores, ranks, charts and the recommendation update instantly. ${tag('E')}</p>`)}
  ${card('c6','Criterion contribution analysis','layers',`<div id="eContrib" class="chart md"></div>`,tools('eContrib'))}
  ${card('c6','Radar comparison','radar',`<div class="row" id="eRSel" style="margin-bottom:4px">${SEGS.map(s=>`<button class="chip ${['S2','S3'].includes(s.id)?'on':''}" data-rs="${s.id}">${s.id}</button>`).join('')}</div><div id="eRadar" class="chart md"></div>`,tools('eRadar'))}
  ${card('c12','Sensitivity analysis','activity',`<div class="row" style="margin-bottom:6px"><label class="dim">Vary the weight of <select class="sel" id="eSensC">${CRIT.map(c=>`<option value="${c.k}">${c.n}</option>`).join('')}</select> from 0 to 40 points, other weights fixed</label></div><div id="eSens" class="chart md"></div><p class="note" id="eSensNote"></p>`,tools('eSens'))}
 </div>`;
 icons();
 const wBox=$('#eW');
 const drawW=()=>{const n=normW();wBox.innerHTML=CRIT.map(c=>`<div class="sl"><div class="t"><span title="${c.why}">${c.n}</span><b>${(n[c.k]*100).toFixed(1)}%</b></div><input type="range" min="0" max="40" step="1" value="${S.w[c.k]}" data-w="${c.k}" aria-label="${c.n} weight"></div>`).join('');
  $$('input[data-w]',wBox).forEach(i=>{rangeFill(i);i.oninput=()=>{S.w[i.dataset.w]=+i.value;rangeFill(i);const n2=normW();$$('.sl',wBox).forEach((sl,j)=>sl.querySelector('b').textContent=(n2[CRIT[j].k]*100).toFixed(1)+'%');update()};i.onchange=save})};
 const drawTable=()=>{const sc=scores();$('#eTable').innerHTML=`<thead><tr><th>Criterion</th><th class="n">Weight</th>${SEGS.map(s=>`<th class="n">${s.id}<br><span style="text-transform:none;letter-spacing:0;font-weight:400">${s.n.split(' ').slice(0,2).join(' ')}</span></th>`).join('')}</tr></thead><tbody>
  ${CRIT.map(c=>`<tr><td>${c.n}</td><td class="n" data-nw="${c.k}"></td>${SEGS.map(s=>`<td class="n"><input class="rnum" type="number" min="1" max="5" step="1" value="${S.r[s.id][c.k]}" data-rs2="${s.id}" data-rc="${c.k}" aria-label="${s.id} ${c.n} rating"></td>`).join('')}</tr>`).join('')}
  <tr><td><b>Weighted score</b></td><td class="n">100%</td>${SEGS.map(s=>`<td class="n" data-sc="${s.id}"></td>`).join('')}</tr><tr><td><b>Rank</b></td><td></td>${SEGS.map(s=>`<td class="n" data-rk="${s.id}"></td>`).join('')}</tr></tbody>`;
  $$('input[data-rs2]').forEach(i=>i.onchange=()=>{let v=Math.round(+i.value);if(!(v>=1))v=1;if(v>5)v=5;i.value=v;S.r[i.dataset.rs2][i.dataset.rc]=v;save();update()})};
 let rsel=new Set(['S2','S3']);
 $$('#eRSel .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?rsel.add(b.dataset.rs):rsel.delete(b.dataset.rs);update()});
 $('#eSensC').onchange=()=>update();
 $('#eReset').onclick=()=>{S.w=JSON.parse(JSON.stringify(DEF.w));S.r=JSON.parse(JSON.stringify(DEF.r));save();drawW();drawTable();update();toast('Weights and ratings reset')};
 CSVF.eval=()=>{const sc=scores();csv('weighted_evaluation.csv',[['Criterion','Normalised weight'].concat(SEGS.map(s=>s.id+' rating'))].concat(CRIT.map(c=>[c.n,normW()[c.k].toFixed(4)].concat(SEGS.map(s=>S.r[s.id][c.k])))).concat([['Weighted score',''].concat(SEGS.map(s=>sc.find(x=>x.id===s.id).score))],[['Rank',''].concat(SEGS.map(s=>sc.find(x=>x.id===s.id).rank))]))};
 function update(){const sc=scores(),n=normW();
  $$('[data-nw]').forEach(td=>td.textContent=(n[td.dataset.nw]*100).toFixed(1)+'%');
  sc.forEach(s=>{const a=$(`[data-sc="${s.id}"]`),b=$(`[data-rk="${s.id}"]`);if(a){a.innerHTML=`<b class="${s.rank===1?'gold':''}">${s.score.toFixed(2)}</b>`}if(b)b.textContent=s.rank});
  chart('eRank',{grid:{left:4,right:48,top:6,bottom:4,containLabel:true},animationDurationUpdate:REDUCE()?0:600,tooltip:{formatter:p=>`${sc[p.dataIndex].n}: ${sc[p.dataIndex].score.toFixed(2)} · rank ${sc[p.dataIndex].rank}`},xAxis:ax({type:'value',max:5,show:false}),yAxis:ax({type:'category',inverse:true,data:sc.map(s=>s.id+' '+s.n.split(' ').slice(0,2).join(' ')),axisLabel:{color:G.tx2}}),
   series:[{type:'bar',barWidth:14,showBackground:true,backgroundStyle:{color:'#1d1d1b',borderRadius:7},label:{show:true,position:'right',color:G.gl,formatter:p=>p.value.toFixed(2)},data:sc.map(s=>({value:s.score,itemStyle:{borderRadius:7,color:s.rank===1?hg(G.br,G.gl):hg('#3f3a32','#72563C')}}))}]});
  const t=sc[0],s2=sc[1];const best=CRIT.map(c=>({c,d:(t.contrib[c.k]-s2.contrib[c.k])})).sort((a,b)=>b.d-a.d);
  $('#eWhy').innerHTML=`<b class="gold">Recommended target: ${t.id} ${t.n}</b> (${t.score.toFixed(2)}/5), ${(t.score-s2.score).toFixed(2)} ahead of ${s2.id}. It leads mainly on <b>${best[0].c.n}</b>${best[1].d>0?` and <b>${best[1].c.n}</b>`:''}${best[best.length-1].d<0?`, while ${s2.id} is stronger on ${best[best.length-1].c.n}`:''}.`;
  chart('eContrib',{legend:{top:0,textStyle:{color:G.tx2,fontSize:10},itemWidth:10,itemHeight:8},grid:{left:4,right:10,top:44,bottom:4,containLabel:true},tooltip:{trigger:'axis',axisPointer:{type:'shadow'},valueFormatter:v=>v.toFixed(2)},xAxis:ax({type:'category',data:SEGS.map(s=>s.id)}),yAxis:ax({type:'value',max:5}),
   series:CRIT.map((c,i)=>({name:c.n,type:'bar',stack:'t',barWidth:'46%',itemStyle:{color:PAL[i],borderRadius:i===CRIT.length-1?[6,6,0,0]:0},data:SEGS.map(s=>+(n[c.k]*S.r[s.id][c.k]).toFixed(3))}))});
  chart('eRadar',{legend:{bottom:0,textStyle:{color:G.tx2}},radar:{indicator:CRIT.map(c=>({name:c.n,max:5})),radius:'60%',axisName:{color:G.tx2,fontSize:10},splitLine:{lineStyle:{color:'#3a3732'}},splitArea:{show:false},axisLine:{lineStyle:{color:'#3a3732'}}},
   series:[{type:'radar',data:SEGS.filter(s=>rsel.has(s.id)).map((s,i)=>({name:s.id+' '+s.n,value:CRIT.map(c=>S.r[s.id][c.k]),lineStyle:{color:PAL[i]},itemStyle:{color:PAL[i]},areaStyle:{color:PAL[i],opacity:.14}}))}]});
  const ck=$('#eSensC').value;const xs=d3.range(0,41,2);const lines=SEGS.map(s=>({s,pts:xs.map(x=>{const raw=Object.assign({},S.w,{[ck]:x});const tot=Object.values(raw).reduce((a,b)=>a+b,0);return tot?CRIT.reduce((a,c)=>a+raw[c.k]/tot*S.r[s.id][c.k],0):0})}));
  const leaders=xs.map((x,i)=>lines.slice().sort((a,b)=>b.pts[i]-a.pts[i])[0].s.id);const changes=[...new Set(leaders)];
  chart('eSens',{legend:{top:0,textStyle:{color:G.tx2}},grid:{left:8,right:14,top:34,bottom:24,containLabel:true},tooltip:{trigger:'axis',valueFormatter:v=>v.toFixed(2)},xAxis:ax({type:'category',data:xs.map(String),name:'weight points',nameLocation:'middle',nameGap:24,nameTextStyle:{color:G.tx3}}),yAxis:ax({type:'value',min:1,max:5}),
   series:lines.map((l,i)=>({name:l.s.id,type:'line',smooth:.2,symbol:'none',lineStyle:{width:l.s.id===t.id?2.6:1.4,color:PAL[i]},itemStyle:{color:PAL[i]},data:l.pts.map(v=>+v.toFixed(3)),markLine:i===0?{symbol:'none',lineStyle:{color:G.tx3,type:'dashed'},label:{color:G.tx3,formatter:'current'},data:[{xAxis:String(Math.round(S.w[ck]/2)*2)}]}:undefined}))});
  $('#eSensNote').innerHTML=changes.length===1?`<b class="pos">Robust:</b> ${changes[0]} stays top across the full range of this weight.`:`<b class="warn">Sensitive:</b> the leader changes (${changes.join(' → ')}) as this weight moves.`;
  if($('#ovSeg'))$('#ovSeg').textContent=t.n;
 }
 drawW();drawTable();update();
};

 `<div class="grid">

    markLine:{silent:true,symbol:'none',lineStyle:{color:'#3a3732',type:'dashed'},label:{show:false},data:[{xAxis:15},{yAxis:3}]}}]});
  const bv=COMP.find(c=>c.id==='bv'),l70=COMP.find(c=>c.id==='l70');
  $('#pmNote').innerHTML=`At ${money(S.amulPrice)}, Amul is ${per<bv.per100?'<b class="pos">'+((1-per/bv.per100)*100).toFixed(0)+'% below</b>':'<b class="neg">above</b>'} Bournville and ${((1-per/l70.per100)*100).toFixed(0)}% below Lindt 70% per gram. ${per>14?'<span class="warn">This moves Amul out of the affordable-premium gap.</span>':''} Quality scores are analytical assessments ${tag('E')}.`};
 pr.oninput=()=>{S.amulPrice=+pr.value;rangeFill(pr);draw()};pr.onchange=save;
 $$('#pmSel .chip').forEach(b=>b.onclick=()=>{b.classList.toggle('on');b.classList.contains('on')?on.add(b.dataset.pm):on.delete(b.dataset.pm);draw()});draw();

PAGES.entry=root=>{
 const crit=[['inv','Investment required',true],['risk','Risk',true],['ctrl','Control',false],['acc','Market accessibility',false],['scale','Scalability',false]];
 root.innerHTML=ph('Market Entry Strategy','Amul already exports chocolates to the UAE, so this is market expansion and deeper penetration, not first-time entry.',tag('V')+tag('R'))+
 `<div class="grid">
  ${card('c12','Existing UAE presence (verified)','circle-check',`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
   <div><div class="kl gold">Amul export page</div><p class="dim">Lists chocolates among Amul products available in the UAE, imported by Chunilal Purshottam & Co. (Dubai), Al Tayeb Distribution (Abu Dhabi) and Agri Fresh Foodstuff (Dubai). ${srcA('amulX')}</p></div>
   <div><div class="kl gold">Cross-border</div><p class="dim">Amul Dark Chocolate 150 g is sold to UAE shoppers via Desertcart (cross-border reseller). ${srcA('desert')}</p></div>
   <div><div class="kl gold">Gap</div><p class="dim">No Amul dark chocolate listing was found on Carrefour UAE or LuLu online: visible mainstream presence is limited.</p></div>
   <div><div class="kl gold">Framing</div><p><b class="pos">Market expansion / penetration</b></p></div></div>`)}
  ${card('c7','Entry mode comparison matrix','table',`<div class="tw"><table class="t" id="enT"></table></div><p class="note">Scores 1 (low) – 5 (high) are analytical. For investment and risk, lower is better and is inverted in the attractiveness score. ${tag('E')}</p>`)}
  ${card('c5','Your priorities','sliders-horizontal',`<div id="enW"></div><div id="enChart" class="chart sm"></div>`,tools('enChart'))}
  ${card('c12','Distribution flow (click a stage)','truck',`<svg class="flow" id="flow" viewBox="0 0 1000 130" role="group" aria-label="Distribution flow"></svg><div id="flowInfo" class="note" style="font-size:12px"></div>`)}
 </div>`;
 icons();const ew={inv:3,risk:4,ctrl:4,acc:3,scale:3};
 const sc=e=>{const t=Object.values(ew).reduce((a,b)=>a+b,0)||1;return crit.reduce((a,[k,,inv])=>a+ew[k]*(inv?6-e[k]:e[k]),0)/t};
 const draw=()=>{const ranked=ENTRY.map(e=>({e,s:sc(e)})).sort((a,b)=>b.s-a.s);
  $('#enT').innerHTML=`<thead><tr><th>Mode</th>${crit.map(([k,n])=>`<th class="n">${n}</th>`).join('')}<th class="n">Attractiveness</th><th>Assessment</th></tr></thead><tbody>${ENTRY.map(e=>`<tr class="${e.rec?'hl':''}"><td><b>${e.n}</b>${e.rec?' '+tag('R'):''}</td>${crit.map(([k])=>`<td class="n">${'●'.repeat(e[k])}<span class="muted">${'●'.repeat(5-e[k])}</span></td>`).join('')}<td class="n gold"><b>${sc(e).toFixed(2)}</b></td><td class="dim">${e.fit}</td></tr>`).join('')}</tbody>`;
  chart('enChart',{grid:{left:4,right:40,top:6,bottom:4,containLabel:true},xAxis:ax({type:'value',max:5,show:false}),yAxis:ax({type:'category',inverse:true,data:ranked.map(r=>r.e.n.replace(' (lead distributor)','')),axisLabel:{color:G.tx2,fontSize:10.5}}),
   series:[{type:'bar',barWidth:11,showBackground:true,backgroundStyle:{color:'#1d1d1b',borderRadius:6},label:{show:true,position:'right',color:G.gl,formatter:p=>p.value.toFixed(2)},data:ranked.map((r,i)=>({value:+r.s.toFixed(3),itemStyle:{borderRadius:6,color:i===0?hg(G.br,G.gl):hg('#3f3a32','#72563C')}}))}]})};
 $('#enW').innerHTML=crit.map(([k,n])=>`<div class="sl"><div class="t"><span>Importance of ${n.toLowerCase()}</span><b data-ewl="${k}">${ew[k]}</b></div><input type="range" min="0" max="5" step="1" value="${ew[k]}" data-ew="${k}" aria-label="Importance of ${n}"></div>`).join('');

  chart('rRank',{grid:{left:4,right:40,top:6,bottom:4,containLabel:true},animationDurationUpdate:REDUCE()?0:500,tooltip:{formatter:p=>`${R[p.dataIndex].n}: ${R[p.dataIndex].score} (${R[p.dataIndex].lvl})`},xAxis:ax({type:'value',max:25,show:false}),yAxis:ax({type:'category',inverse:true,data:R.map(r=>{const t=r.id+'. '+r.n;return t.length>28?t.slice(0,27)+'…':t}),axisLabel:{color:G.tx2,fontSize:10.5}}),
   series:[{type:'bar',barWidth:11,showBackground:true,backgroundStyle:{color:'#1d1d1b',borderRadius:6},label:{show:true,position:'right',color:G.tx2},data:R.map(r=>({value:r.score,itemStyle:{borderRadius:6,color:lvlCol(r.lvl)}}))}]});
  const openIds=$$('#rReg .acc.open').map(a=>a.dataset.rid);
  $('#rReg').innerHTML=R.map(r=>`<div class="acc ${openIds.includes(String(r.id))?'open':''}" data-rid="${r.id}"><button aria-expanded="false"><span class="ttl">${r.id}. ${r.n} <span class="muted" style="font-weight:400;font-size:11px">${r.cat}</span></span><span class="tag" style="color:${lvlCol(r.lvl)};border-color:${lvlCol(r.lvl)}55">${r.lvl} · ${r.score}</span><span class="chev">${ico('chevron-down')}</span></button><div class="body"><div><div class="inner"><div class="row" style="margin:8px 0">
   <label class="dim">Probability <select class="sel" data-rp="${r.id}">${[1,2,3,4,5].map(v=>`<option ${v===r.p?'selected':''}>${v}</option>`).join('')}</select></label><label class="dim">Impact <select class="sel" data-ri="${r.id}">${[1,2,3,4,5].map(v=>`<option ${v===r.i?'selected':''}>${v}</option>`).join('')}</select></label></div><h4>Mitigation strategy</h4><p>${r.mit}</p></div></div></div></div>`).join('');
  bindAcc(root);icons();
  $$('[data-rp],[data-ri]').forEach(s=>s.onchange=()=>{const id=+(s.dataset.rp||s.dataset.ri);S.risks[id]=S.risks[id]||{};S.risks[id][s.dataset.rp?'p':'i']=+s.value;save();draw()});
 }
 draw();
};

/* ---------- 14. ROADMAP ---------- */
PAGES.roadmap=root=>{
 root.innerHTML=ph('Strategic Roadmap','12-month implementation plan with proposed KPIs, deliverables and dependencies. Click a bar or milestone.',tag('R'))+
 `<div class="grid">${card('c12','Gantt timeline','milestone',`<div id="gantt" class="chart lg"></div>`,tools('gantt'))}
 ${card('c7','Workstream detail','info',`<div id="gInfo"></div>`)}${card('c5','Milestones','flag',`<div class="list">${MILESTONES.map((m,i)=>`<button class="li" data-ms="${i}"><span class="dot" style="font-family:var(--f-num);font-weight:700">M${m.m}</span><span><b>${m.n}</b><span>Month ${m.m}</span></span></button>`).join('')}</div>`)}</div>`;
 icons();
 const show=i=>{const r=ROADMAP[i];$('#gInfo').innerHTML=`<h4 style="font-family:var(--f-head);font-weight:500;font-size:19px;margin:0 0 6px;color:var(--gold-l)">${r.n}</h4><dl class="kv"><dt>Timing</dt><dd>Month ${r.s+1} – ${r.e}</dd><dt>Proposed KPIs</dt><dd>${r.kpi}</dd><dt>Deliverables</dt><dd>${r.del}</dd><dt>Depends on</dt><dd>${r.dep}</dd></dl>`};
 const c=chart('gantt',{grid:{left:8,right:16,top:20,bottom:24,containLabel:true},tooltip:{formatter:p=>p.seriesType==='custom'?`${ROADMAP[p.dataIndex].n}<br>Month ${ROADMAP[p.dataIndex].s+1}–${ROADMAP[p.dataIndex].e}`:`${p.name}`},
  xAxis:ax({type:'value',min:0,max:12,interval:1,axisLabel:{color:G.tx3,formatter:v=>v<12?'M'+(v+1):''},splitLine:{lineStyle:{color:'#2f2d29'}}}),yAxis:ax({type:'category',inverse:true,data:ROADMAP.map(r=>r.n).concat(['Milestones']),axisLabel:{color:G.tx2}}),
  series:[{type:'custom',renderItem:(params,api)=>{const s=api.coord([api.value(0),api.value(2)]),e=api.coord([api.value(1),api.value(2)]);const h=api.size([0,1])[1]*0.5;const w=(e[0]-s[0]);
    return{type:'rect',shape:{x:s[0],y:s[1]-h/2,width:w,height:h,r:7},style:{fill:ROADMAP[params.dataIndex].col}}},encode:{x:[0,1],y:2},data:ROADMAP.map((r,i)=>[r.s,r.e,i])},
   {type:'scatter',symbol:'diamond',symbolSize:12,itemStyle:{color:G.gl,borderColor:'#1b1b19'},data:MILESTONES.map(m=>({name:m.n,value:[m.m-0.5,ROADMAP.length]})),label:{show:true,position:'bottom',color:G.tx3,fontSize:9.5,formatter:p=>'M'+(Math.round(p.value[0]+0.5))}}]});
 if(c){c.off('click');c.on('click',p=>{if(p.seriesType==='custom')show(p.dataIndex);else{const m=MILESTONES[p.dataIndex];const i=ROADMAP.findIndex(r=>m.m>r.s&&m.m<=r.e);show(i<0?0:i);toast('Milestone M'+m.m+': '+m.n)}})}
 $$('[data-ms]').forEach(b=>b.onclick=()=>{const m=MILESTONES[+b.dataset.ms];const i=ROADMAP.findIndex(r=>m.m>r.s&&m.m<=r.e);show(i<0?0:i);toast('Milestone M'+m.m+': '+m.n)});show(0);
};

/* ---------- 15. AI ---------- */
PAGES.ai=root=>{
 root.innerHTML=ph('AI Research Insights','How AI tools were used in this project, and the key research questions answered from the verified dataset.',tag('E'))+
 `<div class="grid">${card('c7','Key research questions','sparkles',QA.map((q,i)=>acc(q.q,`<p>${q.a}</p><p class="src">Sources: ${q.r.map(srcA).join(' · ')}</p>`,i===0)).join(''))}
 ${card('c5','AI-assisted research method','book-open',`<ol class="dim" style="padding-left:18px;margin:0"><li>AI search scanned official statistics (FCSC, IMF, World Bank, MEA, UAE MOFA) and retailer listings.</li><li>Every figure was checked against its original source and stored with year, unit and link.</li><li>Conflicting market-size estimates were flagged rather than averaged.</li><li>AI checked the weighted-score and financial arithmetic; formulas are shown on each page.</li><li>Ratings, personas and scenarios are labelled as analytical or illustrative.</li></ol><p class="note">Limitation: AI can surface wrong or outdated pages; links are provided so each number can be checked.</p>`)}</div>`;
 bindAcc(root);icons();
};

/* ---------- 16. REFERENCES ---------- */
PAGES.refs=root=>{
 const L=Object.entries(SRC);
 root.innerHTML=ph('Research & References Centre','Searchable source library, methodology notes, assignment compliance checklist and limitations.',tag('V'))+
 `<div class="grid"><section class="card c12"><div class="ch"><h3>${ico('library')}Source library</h3><div class="row"><input class="txt" id="rfS" placeholder="Search sources, metrics…" aria-label="Search sources"><button class="btn" data-act="csv" data-csv="refs">${ico('file-down')}CSV</button></div></div>
  <div class="tw" style="max-height:460px;overflow:auto"><table class="t"><thead><tr><th>Organisation</th><th>Publication</th><th>Published</th><th>Supported metric</th><th>Data year</th><th>Limitation</th></tr></thead><tbody id="rfB"></tbody></table></div></section>
  ${card('c6','Methodology','flask-conical',METHODS.map(m=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><div class="kl gold">${m[0]}</div><div class="dim">${m[1]}</div></div>`).join(''))}
  ${card('c6','Assignment compliance checklist','list-checks',`<div class="tw"><table class="t"><thead><tr><th>Task</th><th>Requirement</th><th>Where</th><th></th></tr></thead><tbody>${COMPLIANCE.map(c=>`<tr><td class="gold">${c[0]}</td><td>${c[1]}</td><td class="dim">${c[2]}</td><td class="pos">✓</td></tr>`).join('')}</tbody></table></div><p class="note">Assignment guidelines file was not available when this dashboard was built; checklist follows the written brief.</p>`)}
  ${card('c12','Research limitations','alert-triangle',`<ul class="dim" style="padding-left:18px;margin:0">${['No primary consumer survey; ratings, personas and quality scores are analytical.','No verified mainstream UAE shelf price for Amul Dark Chocolate; AED 14.95 is a proposal.','Published UAE chocolate market sizes conflict; one widely cited figure contains a unit error.','No public UAE-only dark-chocolate market size; premium-segment evidence used as a proxy.','Chocolate import data (UN Comtrade, HS 1806) were not extracted.','Ramadan/Eid gifting share combines Saudi Arabia and the UAE.','CEPA staging for HS 1806 not confirmed.','Emirate-level statistics beyond Dubai population and Indian-diaspora distribution were not available.','Prices are a November 2026 snapshot; promotions change frequently.','Financial simulator uses illustrative costs, not GCMMF data.','Islamic festival months are approximate (they move ~11 days earlier each year).'].map(x=>`<li>${x}</li>`).join('')}</ul>`)}</div>`;
 icons();
 CSVF.refs=()=>csv('references.csv',[['Organisation','Title','Published','Metric','Data year','URL','Limitation']].concat(L.map(([k,s])=>[s.org,s.title,s.date,s.metric,s.year,s.url,s.lim])));
 const draw=()=>{const q=$('#rfS').value.toLowerCase();$('#rfB').innerHTML=L.filter(([k,s])=>!q||Object.values(s).join(' ').toLowerCase().includes(q)).map(([k,s])=>`<tr><td><b>${s.org}</b></td><td><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></td><td class="dim">${s.date}</td><td>${s.metric}</td><td class="dim">${s.year}</td><td class="muted">${s.lim}</td></tr>`).join('')};
 $('#rfS').oninput=draw;draw();
};

/* ============ SHELL, ROUTER & GLOBAL FEATURES ============ */
const RENDERED={};let CUR='overview';
function buildShell(){
 $('#nav').innerHTML='<div class="nav-ind" id="navInd"></div>'+NAV.map(n=>`<button data-nav="${n.id}" aria-label="${n.n}">${ico(n.i)}<span>${n.n}</span></button>`).join('');
 $('#pages').innerHTML=NAV.map(n=>`<div class="page" id="p-${n.id}" role="region" aria-label="${n.n}"></div>`).join('');
 icons();
 const tip=$('#navTip');
 $$('#nav button').forEach(b=>{b.addEventListener('mouseenter',()=>{const r=b.getBoundingClientRect();tip.textContent=b.getAttribute('aria-label');tip.style.top=(r.top+r.height/2-12)+'px';tip.style.opacity=1});b.addEventListener('mouseleave',()=>tip.style.opacity=0)});
}
function go(id,push=true){if(!PAGES[id])id='overview';CUR=id;
 $$('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));
 $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===id));
 const b=$(`#nav button[data-nav="${id}"]`);if(b){$('#navInd').style.transform=`translateY(${b.offsetTop}px)`;b.scrollIntoView({block:'nearest'})}
 const n=NAV.find(x=>x.id===id);$('#ttl').innerHTML=`${n.n}<small>Amul Dark Chocolate × UAE</small>`;document.title=n.n+' · Global Market Explorer';
 const root=$('#p-'+id);
 if(!RENDERED[id]){try{PAGES[id](root);RENDERED[id]=true}catch(err){console.error(err);root.innerHTML=`<div class="card"><p class="neg">This section failed to load: ${String(err.message||err)}</p></div>`}}
 else{if(id==='overview'){gaugeChart('ovGauge',topSeg().score);drawOvDonut()}
  Object.keys(CH).forEach(k=>{const el=document.getElementById(k);if(el&&root.contains(el))CH[k].resize()})}
 stagger(root);if(push&&location.hash!=='#'+id)history.replaceState(null,'','#'+id);
 window.scrollTo({top:0,behavior:'auto'});
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-nav]');if(a){e.preventDefault();go(a.dataset.nav);$('#sres').classList.remove('on')}});

/* search */
function searchIndex(){const out=[];NAV.forEach(n=>out.push({t:n.n,s:'Section',k:(n.n+' '+n.kw).toLowerCase(),go:n.id}));
 Object.values(SRC).forEach(s=>out.push({t:s.title,s:'Source · '+s.org,k:(s.title+' '+s.org+' '+s.metric).toLowerCase(),go:'refs'}));
 COMP.forEach(c=>out.push({t:c.brand+' '+c.variant,s:'Competitor · '+money(c.per100)+'/100 g',k:(c.brand+' '+c.variant+' '+c.pos).toLowerCase(),go:'competitors'}));
 SEGS.forEach(s=>out.push({t:s.id+' '+s.n,s:'Segment',k:(s.n+' '+s.demo+' '+s.psy).toLowerCase(),go:'segments'}));
 RISKS.forEach(r=>out.push({t:r.n,s:'Risk',k:(r.n+' '+r.cat+' '+r.mit).toLowerCase(),go:'risk'}));
 EMIRATES.forEach(e=>out.push({t:e.n,s:'Emirate',k:(e.n+' '+e.retail).toLowerCase(),go:'country'}));
 Object.entries(KPI).forEach(([k,K])=>out.push({t:K.label,s:'KPI · '+(K.v==null?'not available':nf(K.v,K.v%1?2:0)+' '+K.unit)+' · '+K.year,k:(K.label+' '+K.tip).toLowerCase(),go:'country'}));
 return out}
function bindSearch(){const inp=$('#gs'),res=$('#sres');let IDX=null;
 inp.addEventListener('input',()=>{IDX=IDX||searchIndex();const q=inp.value.trim().toLowerCase();if(!q){res.classList.remove('on');return}
  const terms=q.split(/\s+/);const hits=IDX.filter(x=>terms.every(t=>x.k.includes(t))).slice(0,12);
  res.innerHTML=hits.length?hits.map((h,i)=>`<button data-h="${i}"><b>${h.t}</b><span>${h.s}</span></button>`).join(''):'<button disabled><span>No matches</span></button>';res.classList.add('on');
  $$('[data-h]',res).forEach(b=>b.onclick=()=>{const h=hits[+b.dataset.h];go(h.go);res.classList.remove('on');inp.value='';})});
 document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.classList.remove('on')});
}

/* settings, currency, fullscreen, presentation */
function setCur(c){S.cur=c;save();$$('#curSeg button').forEach(b=>b.classList.toggle('on',b.dataset.cur===c));Object.keys(RENDERED).forEach(k=>delete RENDERED[k]);go(CUR,false);toast(c==='AED'?'Showing AED':'Showing INR at ₹'+FX.rate+' per AED ('+FX.date+')')}
function fullscreen(){const d=document;if(!d.fullscreenElement){(d.documentElement.requestFullscreen||function(){}).call(d.documentElement)}else d.exitFullscreen()}
function settings(){openModal(`<h2 style="font-family:var(--f-head);font-weight:500;margin:0 0 10px">Settings</h2>
 <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Currency (rate ₹${FX.rate}/AED, ${FX.date}, ${srcA('fx')})</span><div class="seg"><button data-sc="AED" class="${S.cur==='AED'?'on':''}">AED</button><button data-sc="INR" class="${S.cur==='INR'?'on':''}">INR</button></div></div>
 <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Reduce motion</span><button class="btn" id="stRm">${S.reduce?'On':'Off'}</button></div>
 <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Presentation mode (hides sidebar & search)</span><button class="btn" id="stPres">${document.body.classList.contains('present')?'On':'Off'}</button></div>
 <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>Print / save as PDF (all sections)</span><button class="btn" id="stPrint">${ico('printer')}Print</button></div>
 <div class="row" style="justify-content:space-between;padding:8px 0"><span>Reset all filters, weights, ratings and saved scenarios</span><button class="btn" id="stReset">${ico('rotate-ccw')}Reset</button></div>
 <p class="note">Settings are stored only in this browser. External libraries (ECharts, D3, topojson, Lucide, Google Fonts, world map data) load from public CDNs and need an internet connection.</p>`);
 $$('[data-sc]').forEach(b=>b.onclick=()=>{setCur(b.dataset.sc);$('#modal').classList.remove('on')});
 $('#stRm').onclick=e=>{S.reduce=!S.reduce;save();document.body.classList.toggle('reduce',S.reduce);e.target.textContent=S.reduce?'On':'Off'};
 $('#stPres').onclick=e=>{document.body.classList.toggle('present');e.target.textContent=document.body.classList.contains('present')?'On':'Off';setTimeout(()=>Object.values(CH).forEach(c=>c.resize()),350)};
 $('#stPrint').onclick=()=>{$('#modal').classList.remove('on');printAll()};
 $('#stReset').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));FIN=Object.assign({},FIN_DEF);FIN_MODE='Base';save();document.body.classList.remove('reduce');Object.keys(RENDERED).forEach(k=>delete RENDERED[k]);$('#modal').classList.remove('on');go(CUR,false);toast('All settings reset')};
}
function printAll(){NAV.forEach(n=>{if(!RENDERED[n.id]){const root=$('#p-'+n.id);try{root.classList.add('on');PAGES[n.id](root);RENDERED[n.id]=true}catch(e){}}});
 $$('.page').forEach(p=>p.classList.add('on'));$$('.card.stagger').forEach(c=>c.classList.add('in'));setTimeout(()=>{Object.values(CH).forEach(c=>c.resize());window.print()},800)}
window.addEventListener('afterprint',()=>{$$('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+CUR));Object.values(CH).forEach(c=>c.resize())});

/* init */
function init(){buildShell();bindSearch();
 if(S.reduce)document.body.classList.add('reduce');
 $('#sideT').onclick=()=>{document.body.classList.toggle('side-open');$('#sideT').setAttribute('aria-expanded',document.body.classList.contains('side-open'));setTimeout(()=>{Object.values(CH).forEach(c=>c.resize());const b=$('#nav button.on');if(b)$('#navInd').style.transform=`translateY(${b.offsetTop}px)`},320)};
 $('#bSet').onclick=settings;$('#bFull').onclick=fullscreen;$('#bFull2').onclick=fullscreen;$('#bPrint').onclick=printAll;$('#bPres').onclick=()=>{document.body.classList.toggle('present');setTimeout(()=>Object.values(CH).forEach(c=>c.resize()),350);toast(document.body.classList.contains('present')?'Presentation mode on (Esc or button to exit)':'Presentation mode off')};
 $$('#curSeg button').forEach(b=>b.onclick=()=>setCur(b.dataset.cur));$$('#curSeg button').forEach(b=>b.classList.toggle('on',b.dataset.cur===S.cur));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('present')&&!document.fullscreenElement){document.body.classList.remove('present');setTimeout(()=>Object.values(CH).forEach(c=>c.resize()),350)}});
 window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==CUR&&PAGES[h])go(h,false)});
 icons();go((location.hash||'#overview').slice(1),false);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

</script>
